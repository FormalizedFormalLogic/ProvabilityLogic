name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Otherwise a merge queue entry has no status checks to wait on.
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `lake cache get` walks back from HEAD to a published revision.
          fetch-depth: 100
      # elan and Mathlib's oleans only; the caches below are tighter than lean-action's own.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      # Our own oleans, archived by `lake pack`. Entries are immutable, hence the sha;
      # `restore-keys` falls back to the newest one on the same toolchain and manifest.
      - name: Restore project cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/ProvabilityLogic-x86_64-unknown-linux-gnu.tar.gz
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Unpack project cache
        if: hashFiles('.lake/ProvabilityLogic-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      # The same outputs from the shared FFL cache, which unlike the tarball is keyed by revision
      # and so also covers fork pull requests and fresh clones.
      - name: Restore the Lake cache
        uses: FormalizedFormalLogic/.github/lake-cache/restore@main
        with:
          # A tarball hit above already carries everything this would fetch.
          skip-download: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
          # `lake exe cache get` is occasionally short a module; the build compiles the rest.
          assert-fresh: ''

      # Foundation's, at the revision the manifest pins rather than at our HEAD. `package` is what
      # distinguishes a dependency from the root package.
      - name: Restore Foundation's build from the Lake cache
        uses: FormalizedFormalLogic/.github/lake-cache/restore@main
        with:
          repo: FormalizedFormalLogic/Foundation
          package: Foundation
          assert-fresh: ''
      # A no-op on a hit; a source build when the pin is at an unpublished revision.
      - name: Build Foundation
        run: lake build Foundation
      # Lake replays a dependency's cached warnings downstream, and Foundation's are not ours.
      - name: Clear Foundation's replayed-warning cache
        run: python3 .github/scripts/clear-dep-warnings.py .lake/packages/Foundation/.lake/build

      # A fallback tarball carries artifacts of sources since renamed or deleted, and `lake build`
      # leaves them; `leanchecker` then walks an olean compiled against an older environment.
      - name: Prune orphaned build artifacts from renamed/removed sources
        run: |
          python3 - <<'PY'
          import pathlib
          src_root = pathlib.Path('ProvabilityLogic')
          for build_root in [pathlib.Path('.lake/build/lib/lean/ProvabilityLogic'), pathlib.Path('.lake/build/ir/ProvabilityLogic')]:
              if not build_root.exists():
                  continue
              for f in sorted(build_root.rglob('*')):
                  if not f.is_file():
                      continue
                  rel_dir = f.relative_to(build_root).parent
                  base = f.name.split('.', 1)[0]
                  if not (src_root / rel_dir / f'{base}.lean').exists():
                      print(f'removing orphaned artifact {f}')
                      f.unlink()
          PY

      - name: Build ProvabilityLogic
        run: lake build ProvabilityLogic

      - name: Check environment with leanchecker
        run: lake env leanchecker ProvabilityLogic

      # Exits non-zero on an unlisted axiom or a stale `forgive.yml` entry.
      - name: Audit axioms with forgive
        run: lake exe forgive ProvabilityLogic

      # Skipped for fork pull requests, which cannot write the base repository's cache.
      - name: Pack project cache
        run: lake pack
      - name: Save project cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: cache-save
        uses: actions/cache/save@v6
        with:
          path: .lake/ProvabilityLogic-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      # `main` only: a pull request builds a tree that will not exist after the squash-merge.
      - name: Publish the Lake cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: FormalizedFormalLogic/.github/lake-cache/publish@main
        with:
          cache-key: ${{ secrets.LAKE_CACHE_KEY }}
          targets: ProvabilityLogic

      - uses: extractions/setup-just@v3

      # After the pack above, so the archive does not carry doc-gen4's HTML. Via `just`, which
      # clears the marker files that would otherwise freeze the docs against a restored cache.
      - name: Build docs
        run: just docs

      - uses: ts-graphviz/setup-graphviz@v2
      - name: Generate import graph
        run: just import-graph

      - name: Upload lean artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lean-artifacts
          path: |
            .lake/build/doc
            import_graph.png
            import_graph.pdf
            import_graph.html
          retention-days: 1
          include-hidden-files: true

  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just format-bib
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just format-bib' and commit the changes."
            exit 1
          fi

  # mk_all only scans the source tree, so it needs no build.
  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Generate page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - check-references
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download lean artifacts
        uses: actions/download-artifact@v8
        with:
          name: lean-artifacts
      - name: Copy from artifacts to pages
        run: |
          mkdir -p pages
          cp -r "$GITHUB_WORKSPACE/.lake/build/doc" pages/docs
          cp "$GITHUB_WORKSPACE/import_graph.png" \
             "$GITHUB_WORKSPACE/import_graph.pdf" \
             "$GITHUB_WORKSPACE/import_graph.html" \
             pages/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
