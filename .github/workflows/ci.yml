name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest
    env:
      LAKE_ARTIFACT_CACHE: true
      LAKE_RESTORE_ARTIFACTS: true
      LAKE_NO_CACHE: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - uses: extractions/setup-just@v3
      - uses: ts-graphviz/setup-graphviz@v2

      - name: Restore remote cache (Foundation)
        env:
          LAKE_CONFIG: lake-cache.toml
        run: |
          lake cache get \
            --service ffl \
            --max-revs=100 \
            --repo FormalizedFormalLogic/Foundation \
            --package Foundation \
          || echo "::warning::Foundation's cache is incomplete; the build will compile the rest from source"

      - name: Restore remote cache (ProvabilityLogic)
        env:
          LAKE_CONFIG: lake-cache.toml
        run: |
          lake cache get \
            --service ffl \
            --max-revs=100 \
            --repo FormalizedFormalLogic/ProvabilityLogic \
          || echo "::warning::ProvabilityLogic's cache is incomplete; the build will compile the rest from source"

      - run: lake build Foundation
      - run: python3 .github/scripts/clear-dep-warnings.py .lake/packages/Foundation/.lake/build

      - run: lake build ProvabilityLogic
      - run: lake env leanchecker ProvabilityLogic

      - run: just forgive
      - run: just import-graph
      - run: just docs

      - name: Save remote cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LAKE_CONFIG: lake-cache.toml
          LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          lake build --no-build -o .lake/outputs.jsonl ProvabilityLogic
          lake cache put \
            .lake/outputs.jsonl \
            --service ffl-upload \
            --repo FormalizedFormalLogic/ProvabilityLogic

      - name: Upload lean artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lean-artifacts
          path: |
            .lake/build/doc
            import_graph.png
            import_graph.pdf
            import_graph.html
          retention-days: 1
          include-hidden-files: true

  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just format-bib
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just format-bib' and commit the changes."
            exit 1
          fi

  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Generate page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - check-references
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download lean artifacts
        uses: actions/download-artifact@v8
        with:
          name: lean-artifacts
      - name: Copy from artifacts to pages
        run: |
          mkdir -p pages
          cp -r "$GITHUB_WORKSPACE/.lake/build/doc" pages/docs
          cp "$GITHUB_WORKSPACE/import_graph.png" \
             "$GITHUB_WORKSPACE/import_graph.pdf" \
             "$GITHUB_WORKSPACE/import_graph.html" \
             pages/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
