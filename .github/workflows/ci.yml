name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Required so these checks also run against the queue's speculative merge
  # commit; otherwise a merge queue entry has no status checks to wait on.
  merge_group:
    branches:
      - main
  workflow_dispatch:

# Supersede stale runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Build ProvabilityLogic, and generate the docs and import graph — all sharing the one build.
  #
  # Three cache reads feed this job, and they cover different gaps:
  #   • Foundation, our one expensive dependency, is read from the shared FFL R2 store by the
  #     revision `lake-manifest.json` pins. It has no Reservoir presence, so before that store
  #     existed a pin bump cost the deleted `deps` job a quarter of an hour of elaboration, ahead
  #     of this one rather than beside it; now it costs a download.
  #   • Our own modules come from an `actions/cache` tarball (`lake pack`) first and from R2
  #     second, the way Foundation does it. The tarball is branch-local and evictable; R2 is keyed
  #     by revision, so it also serves fork PRs, fresh clones and branches the tarball never saw.
  # Mathlib is neither: `lake exe cache get`, as always, via lean-action.
  build:
    name: Build project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `lake cache get` walks back from HEAD to a published revision, and a PR's own commits
          # never are one — it has to reach the branch point on `main`.
          fetch-depth: 100
      # elan + `lake exe cache get` only (build: false); we drive `lake build` ourselves.
      # Skip lean-action's own whole-.lake GitHub cache (use-github-cache: false) — the two caches
      # below are tighter than shuttling the full tree.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      # ── The project's own build cache (`lake pack`/`unpack`) ─────────────────────────────────────
      # `lake pack` archives ONLY the root package's `.lake/build` (our own oleans), never the
      # dependency trees. Restoring + unpacking it lets `lake build` reuse traces and rebuild only
      # the modules that actually changed. The key pins toolchain+manifest (so a Foundation bump
      # busts it) and appends sha because cache entries are immutable; restore-keys fall back to the
      # newest cache with a matching toolchain+manifest.
      - name: Restore project cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .lake/ProvabilityLogic-x86_64-unknown-linux-gnu.tar.gz
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Unpack project cache
        if: hashFiles('.lake/ProvabilityLogic-x86_64-unknown-linux-gnu.tar.gz') != ''
        run: lake unpack

      # Our own modules from the shared FFL R2 cache, keyed by revision rather than by branch, so
      # it also covers fork pull requests and fresh clones. A PR's HEAD was never published, so
      # this lands on its branch point and `lake build` redoes only what the PR touched.
      - name: Restore the Lake cache
        uses: FormalizedFormalLogic/.github/lake-cache/restore@main
        with:
          # A tarball hit above already carries everything this would fetch.
          skip-download: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
          # No freshness assertion: Mathlib is a separate cache, and `lake exe cache get` is
          # occasionally short a module nothing here uses. The build below compiles what is
          # missing, as it always has.
          assert-fresh: ''

      # Foundation's oleans, published by its own CI and read at the revision the manifest pins —
      # not at our HEAD, so `fetch-depth` above has no bearing on this one. `package` is what
      # distinguishes a dependency from the root package; `repo` alone would look Foundation up
      # under our name and find nothing. This is what makes a pin bump a download rather than the
      # quarter of an hour that elaborating Foundation from source costs.
      - name: Restore Foundation's build from the Lake cache
        uses: FormalizedFormalLogic/.github/lake-cache/restore@main
        with:
          repo: FormalizedFormalLogic/Foundation
          package: Foundation
          assert-fresh: ''
      # Nothing to do when the step above filled the build; a source build otherwise, which is the
      # legitimate outcome for a pin at a revision Foundation's `master` never published.
      - name: Build Foundation
        run: lake build Foundation
      # Lake replays a dependency's cached warnings on every downstream build. Foundation's are
      # upstream's, not ours to fix, and they would bury this job's own output.
      - name: Clear Foundation's replayed-warning cache
        run: python3 .github/scripts/clear-dep-warnings.py .lake/packages/Foundation/.lake/build

      # `restore-keys` can fall back to a cache packed before a file was renamed or deleted; `lake
      # build` only rebuilds modules whose *source* changed, so a stale `.olean`/`.trace` for a
      # since-removed path survives untouched. `leanchecker` walks every olean it finds, so an
      # orphaned one — compiled against an older environment — can fail the kernel replay even
      # though nothing on the current source tree is wrong. Drop any build artifact whose module no
      # longer has a matching `.lean` file before building.
      - name: Prune orphaned build artifacts from renamed/removed sources
        run: |
          python3 - <<'PY'
          import pathlib
          src_root = pathlib.Path('ProvabilityLogic')
          for build_root in [pathlib.Path('.lake/build/lib/lean/ProvabilityLogic'), pathlib.Path('.lake/build/ir/ProvabilityLogic')]:
              if not build_root.exists():
                  continue
              for f in sorted(build_root.rglob('*')):
                  if not f.is_file():
                      continue
                  rel_dir = f.relative_to(build_root).parent
                  base = f.name.split('.', 1)[0]
                  if not (src_root / rel_dir / f'{base}.lean').exists():
                      print(f'removing orphaned artifact {f}')
                      f.unlink()
          PY

      - name: Build ProvabilityLogic
        run: lake build ProvabilityLogic

      - name: Check environment with leanchecker
        run: lake env leanchecker ProvabilityLogic

      # Every declaration under `ProvabilityLogic` must reach only the axioms `forgive.yml`
      # accepts; the results we still take on faith are listed there by name, so a new one
      # cannot slip in unannounced. Exits non-zero on a violation or a stale allowlist entry.
      - name: Audit axioms with forgive
        run: lake exe forgive ProvabilityLogic

      # Re-pack the freshly built oleans and save under the exact primary key. Skipped for PRs from
      # forks (no write access to the base repo's cache); pushes and same-repo PRs refresh the entry.
      - name: Pack project cache
        run: lake pack
      - name: Save project cache
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: cache-save
        uses: actions/cache/save@v6
        with:
          path: .lake/ProvabilityLogic-x86_64-unknown-linux-gnu.tar.gz
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      # `main` only, after every gate above: a PR builds a tree that will not exist after the
      # squash-merge, and a fork PR gets no secrets anyway.
      - name: Publish the Lake cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: FormalizedFormalLogic/.github/lake-cache/publish@main
        with:
          cache-key: ${{ secrets.LAKE_CACHE_KEY }}
          targets: ProvabilityLogic

      - uses: extractions/setup-just@v3

      # Generated after the project cache is packed, so the archive stays lean and doesn't carry
      # doc-gen4's HTML output. Via `just` rather than `lake build …:docs` directly: doc-gen4's
      # marker files make a restored build cache freeze the generated documentation, and the recipe
      # clears them.
      - name: Build docs
        run: just docs

      - uses: ts-graphviz/setup-graphviz@v2
      - name: Generate import graph
        run: just import-graph

      - name: Upload lean artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lean-artifacts
          path: |
            .lake/build/doc
            import_graph.png
            import_graph.pdf
            import_graph.html
          retention-days: 1
          include-hidden-files: true

  check-references:
    name: Check references.bib format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - name: Install bibtool
        run: |
          sudo apt-get update
          sudo apt-get install -y bibtool
      - name: Check references.bib is formatted
        run: |
          just format-bib
          if [ -n "$(git diff)" ]; then
            echo "references.bib is not formatted. Please run 'just format-bib' and commit the changes."
            exit 1
          fi

  # mk_all only scans the source tree (no build), so it runs as its own lightweight job.
  mk-all-check:
    name: Check mk_all executed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v3
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false
      - name: Check mk_all executed
        run: |
          just mk-all
          if [ -n "$(git diff)" ]; then
            echo "Files were modified by mk_all. Please run 'just mk-all' and commit the changes."
            exit 1
          fi

  deploy:
    name: Generate page
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - check-references
      - mk-all-check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download lean artifacts
        uses: actions/download-artifact@v8
        with:
          name: lean-artifacts
      - name: Copy from artifacts to pages
        run: |
          mkdir -p pages
          cp -r "$GITHUB_WORKSPACE/.lake/build/doc" pages/docs
          cp "$GITHUB_WORKSPACE/import_graph.png" \
             "$GITHUB_WORKSPACE/import_graph.pdf" \
             "$GITHUB_WORKSPACE/import_graph.html" \
             pages/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - uses: actions/deploy-pages@v5
        id: deployment
