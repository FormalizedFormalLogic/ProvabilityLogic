name = "ProvabilityLogic"
version = "0.1.0"
defaultTargets = ["ProvabilityLogic"]

[[lean_lib]]
name = "ProvabilityLogic"

[[lean_lib]]
name = "ProvabilityLogicPlayground"

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "master"

# The arithmetical side of the metamathematics used here (reflection schemata, the
# unboundedness theorem). Pinned to an exact revision; the pin must stay compatible with the
# `Foundation` revision resolved above, which is the one AlphaCentauri itself pins.
[[require]]
name = "AlphaCentauri"
git = "https://github.com/FormalizedFormalLogic/AlphaCentauri"
rev = "3efc61513ecb258f804b2f12fbb7c51f9665d63d"

[[require]]
name = "LeanTypst"
git = "https://github.com/SnO2WMaN/lean-typst.git"
rev = "main"

# Required explicitly, and LAST, so that Mathlib's own pin of ProofWidgets wins over the
# one LeanTypst requires: with a conflicting ProofWidgets, `lake exe cache get` computes
# wrong hashes and refuses to fetch Mathlib's oleans. Keep the revision in sync with the
# `lean-toolchain` above and with Foundation's Mathlib pin.
[[require]]
scope = "leanprover-community"
name = "mathlib"
rev = "v4.33.1"
