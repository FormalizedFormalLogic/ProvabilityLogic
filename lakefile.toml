name = "ProvabilityLogic"
version = "0.1.0"
defaultTargets = ["ProvabilityLogic"]

# Pure Lean, so one published Lake cache serves every platform, not just CI's Linux.
platformIndependent = true

[[lean_lib]]
name = "ProvabilityLogic"

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "master"

# Axiom auditor: `lake exe forgive ProvabilityLogic` checks every declaration against
# `forgive.yml`, so the handful of results we still take on faith stay named and visible.
# It reads Lean's internals, whose shape moves between toolchains, so it is pinned to the tag
# naming ours — the same tag Foundation requires it by.
[[require]]
name = "Forgive"
git = "https://github.com/FormalizedFormalLogic/forgive"
rev = "v4.34.0"
